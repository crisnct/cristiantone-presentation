services:
  web:
    build: .
    image: cristiantone-presentation:local
    container_name: cristiantone-web
    ports:
      - "127.0.0.1:${WEB_PORT:-8082}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
