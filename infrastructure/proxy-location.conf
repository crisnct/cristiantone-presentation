        # BEGIN CRISTIANTONE PORTFOLIO
        location = /cristiantone {
            absolute_redirect off;
            return 308 /cristiantone/$is_args$args;
        }

        location ^~ /cristiantone/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            resolver_timeout 5s;
            set $cristiantone_upstream http://cristiantone-web:8080;
            proxy_pass $cristiantone_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            add_header X-Routed-To cristiantone always;
        }
        # END CRISTIANTONE PORTFOLIO
