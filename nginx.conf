server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    location = /health { access_log off; default_type text/plain; return 200 'healthy\n'; }
    location = /cristiantone { return 308 /cristiantone/$is_args$args; }
    location = /cristiantone/home { return 308 /cristiantone/$is_args$args; }
    location = /cristiantone/home/ { return 308 /cristiantone/$is_args$args; }
    location = /cristiantone/portfolio { return 308 /cristiantone/projects$is_args$args; }
    location = /cristiantone/portfolio/ { return 308 /cristiantone/projects$is_args$args; }
    location ^~ /cristiantone/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location /cristiantone/ { try_files $uri $uri/index.html =404; add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
    location / { return 404; }
    error_page 404 /cristiantone/404.html;
    location = /cristiantone/404.html { internal; add_header Cache-Control "no-cache"; }
}
