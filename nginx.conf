map $http_x_forwarded_host $portfolio_root {
    default /usr/share/nginx/html;
    cristiantone.taila68086.ts.net /usr/share/nginx/html/cristiantone;
}
map $http_x_forwarded_host $portfolio_base {
    default "";
    cristiantone.taila68086.ts.net /cristiantone;
}
server {
    listen 8080;
    server_name _;
    root $portfolio_root;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    location = /health { access_log off; default_type text/plain; return 200 'healthy\n'; }
    location = /home { return 308 $portfolio_base/$is_args$args; }
    location = /home/ { return 308 $portfolio_base/$is_args$args; }
    location = /portfolio { return 308 $portfolio_base/projects$is_args$args; }
    location = /portfolio/ { return 308 $portfolio_base/projects$is_args$args; }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location / { try_files $uri $uri/index.html =404; add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
    error_page 404 /404.html;
    location = /404.html { internal; add_header Cache-Control "no-cache"; }
}
